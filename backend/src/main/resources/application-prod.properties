# Production profile (SPRING_PROFILES_ACTIVE=prod): PostgreSQL, Flyway-managed schema, no demo data, no dev tooling.
# Required environment variables: JWT_SECRET, DATABASE_USERNAME, DATABASE_PASSWORD and either a full JDBC
# DATABASE_URL (jdbc:postgresql://...) or DB_HOST + DB_NAME (+ optional DB_PORT).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}

# Flyway owns the schema; Hibernate never alters it
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none

spring.h2.console.enabled=false

# Behind Render's / Vercel's proxy: trust X-Forwarded-* so client IPs, scheme and redirects are correct
server.forward-headers-strategy=framework

# Graceful shutdown for rolling deploys
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
