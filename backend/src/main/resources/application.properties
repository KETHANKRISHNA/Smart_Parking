spring.application.name=smart-parking-backend
server.port=${PORT:8080}

# Active profile: "dev" (H2, demo data) by default, "prod" for deployments (set SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT. The secret has NO default here: it comes from the dev profile locally and from JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS (only needed when the browser calls the API cross-origin, e.g. Vite dev server)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Demo data (known demo accounts, sample facilities). Off unless explicitly enabled: always on in dev,
# opt-in elsewhere with SEED_DEMO_DATA=true (handy for a presentation, never for real use).
app.seed.enabled=${SEED_DEMO_DATA:false}

# First administrator for an empty database: set both variables and the account is created at startup
# if no admin exists yet. Change the password after the first login.
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Actuator: only the health probe is exposed (used by the hosting platform)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Flyway is switched on by the prod profile only (dev/test use Hibernate's ddl-auto on H2)
spring.flyway.enabled=false

# Brute-force protection for /auth/login and /auth/register (requests per client IP per minute)
app.rate-limit.auth-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:20}

# Business rules
app.booking.payment-window-minutes=${BOOKING_PAYMENT_WINDOW_MINUTES:15}
app.booking.entry-grace-minutes=${BOOKING_ENTRY_GRACE_MINUTES:15}
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}

# OpenAPI / Swagger (off unless enabled)
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Never leak stack traces / internal messages in error responses
server.error.include-message=never
server.error.include-stacktrace=never

# Logging
logging.level.com.smartparking=INFO
logging.level.org.springframework.security=WARN
