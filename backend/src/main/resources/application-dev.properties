# Local development profile: zero-config persistent H2 database, demo data and API docs.
spring.datasource.url=jdbc:h2:file:./data/smartparking;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# H2 console: localhost only
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Local-only signing key (NOT used in production, where JWT_SECRET is mandatory)
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef0123456789abcdef}

app.seed.enabled=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
