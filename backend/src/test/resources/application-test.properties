spring.datasource.url=jdbc:h2:mem:smartparking-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.h2.console.enabled=false

app.jwt.secret=integration-test-secret-key-0123456789abcdef0123456789abcdef
app.seed.enabled=true

# keep the background jobs out of the way of deterministic tests
app.booking.expiry-check-ms=3600000
app.booking.no-show-check-ms=3600000
