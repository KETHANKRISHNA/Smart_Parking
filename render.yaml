# Render Blueprint: the Spring Boot API (Docker) + a managed PostgreSQL database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
# The React front end is deployed separately on Vercel (see frontend/vercel.json) and proxies /api to this service.

databases:
  - name: smartparking-db
    databaseName: smartparking
    user: smartparking
    plan: free            # Render's free Postgres is time-limited; pick a paid plan for anything long-lived

services:
  - type: web
    name: smartparking-api          # => https://smartparking-api.onrender.com (use the URL Render shows you)
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                      # free instances sleep when idle: the first request after a pause is slow
    healthCheckPath: /actuator/health/liveness
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET             # random 256-bit value, generated once by Render
        generateValue: true
      - key: DB_HOST
        fromDatabase: { name: smartparking-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: smartparking-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: smartparking-db, property: database }
      - key: DATABASE_USERNAME
        fromDatabase: { name: smartparking-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: smartparking-db, property: password }
      # --- set these in the Render dashboard (sync: false = not stored in git) ---
      - key: BOOTSTRAP_ADMIN_EMAIL    # creates the first admin on an empty database
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD # 8+ characters with a letter and a number; change it after first login
        sync: false
      - key: CORS_ALLOWED_ORIGINS     # only needed if the browser calls this API directly (not via the Vercel proxy)
        sync: false
      # Optional: load sample facilities and demo accounts (admin@smartparking.com / Admin@123 ...) for a presentation.
      # These are publicly documented passwords, so never leave this on for real use.
      - key: SEED_DEMO_DATA
        value: "false"
